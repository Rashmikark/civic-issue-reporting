<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login — CivicReport</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

<!-- Video Background -->
<video autoplay muted loop playsinline
       style="position:fixed; top:0; left:0; width:100%; height:100%;
              object-fit:cover; z-index:0; opacity:0.35;">
    <source src="{{ url_for('static', filename='bg.mp4') }}" type="video/mp4">
</video>
<!-- Dark overlay -->
<div style="position:fixed; top:0; left:0; width:100%; height:100%;
            background:linear-gradient(135deg,
                rgba(20,20,20,0.55) 0%,
                rgba(40,40,40,0.45) 100%);
            z-index:1;"></div>

<div class="auth-card" style="border-top: 4px solid #7b1fa2;">
    <div class="auth-logo">
        <div class="logo-circle" style="background:#f3e5f5;">🛡️</div>
        <h2 style="color:#7b1fa2;">Admin Access</h2>
        <p>Restricted — Authorized personnel only</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin-login">
        <div class="form-group">
            <label>Admin Username</label>
            <div class="input-icon-wrap">
                <span class="icon">🛡️</span>
                <input type="text" name="username"
                       placeholder="Enter admin username" required>
            </div>
        </div>
        <div class="form-group">
            <label>Admin Password</label>
            <div class="input-icon-wrap">
                <span class="icon">🔒</span>
                <input type="password" name="password"
                       placeholder="Enter admin password" required>
            </div>
        </div>
        <button type="submit" class="btn"
                style="width:100%; justify-content:center;
                       padding:11px; font-size:15px;
                       background:#7b1fa2; color:white;">
            Login as Admin →
        </button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
        Not an admin?
        <a href="/login">Go to User Login</a>
    </div>
    <div class="auth-footer" style="margin-top:8px;">
        <a href="/" style="color:var(--gray-400);">← Back to Home</a>
    </div>
</div>

</body>
</html>

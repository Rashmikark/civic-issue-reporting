<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — CivicReport</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">

<!-- Video Background -->
<video autoplay muted loop playsinline
       style="position:fixed; top:0; left:0; width:100%; height:100%;
              object-fit:cover; z-index:0; opacity:0.35;">
    <source src="{{ url_for('static', filename='bg.mp4') }}" type="video/mp4">
</video>
<!-- Dark overlay -->
<div style="position:fixed; top:0; left:0; width:100%; height:100%;
            background:linear-gradient(135deg,
                rgba(20,20,20,0.55) 0%,
                rgba(40,40,40,0.45) 100%);
            z-index:1;"></div>

<div class="auth-card">
    <div class="auth-logo">
        <div class="logo-circle">🏛️</div>
        <h2>Welcome Back</h2>
        <p>Login to your CivicReport account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
        <div class="form-group">
            <label>Username</label>
            <div class="input-icon-wrap">
                <span class="icon">👤</span>
                <input type="text" name="username"
                       placeholder="Enter your username" required>
            </div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="input-icon-wrap">
                <span class="icon">🔒</span>
                <input type="password" name="password"
                       placeholder="Enter your password" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary"
                style="width:100%; justify-content:center;
                       padding:11px; font-size:15px;">
            Login →
        </button>
    </form>

    <div class="auth-divider">or</div>

    <a href="/admin-login" class="btn btn-outline"
       style="width:100%; justify-content:center;">
        🛡️ Login as Admin
    </a>

    <div class="auth-footer">
        Don't have an account?
        <a href="/register">Register here</a>
    </div>
    <div class="auth-footer" style="margin-top:8px;">
        <a href="/" style="color:var(--gray-400);">← Back to Home</a>
    </div>
</div>

</body>
</html>
